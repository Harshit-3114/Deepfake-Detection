version: "3.8"

services:

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deepfake
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ingestion_service:
    build: ./ingestion_service
    container_name: ingestion_service
    ports:
      - "8000:8000"
    environment:
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      DB_HOST: "postgres"
      DB_USER: "user"
      DB_PASSWORD: "password"
      DB_NAME: "deepfake"
    depends_on:
      - minio
      - postgres

  text_detector:
    build: ./detectors/text_detector
    container_name: text_detector
    ports:
      - "8001:8000"
    depends_on:
      - ingestion_service

  image_detector:
    build: ./detectors/image_detector
    container_name: image_detector
    ports:
      - "8002:8000"
    depends_on:
      - ingestion_service

  audio_detector:
    build: ./detectors/audio_detector
    container_name: audio_detector
    ports:
      - "8003:8000"
    depends_on:
      - ingestion_service

  video_detector:
    build: ./detectors/video_detector
    container_name: video_detector
    ports:
      - "8004:8000"
    depends_on:
      - ingestion_service

  orchestrator_service:
    build: ./orchestrator_service
    container_name: orchestrator_service
    ports:
      - "8400:8400"
    environment:
      S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      S3_BUCKET: "deepfake-blobs"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "deepfake"
      DB_USER: "user"
      DB_PASSWORD: "password"
      TEXT_DETECTOR_URL: "http://text_detector:8000/api/text/detect"
      IMAGE_DETECTOR_URL: "http://image_detector:8000/api/image/detect"
      AUDIO_DETECTOR_URL: "http://audio_detector:8000/api/audio/detect"
      VIDEO_DETECTOR_URL: "http://video_detector:8000/api/video/detect"
      FUSION_URL: "http://fusion_service:8000/api/fuse"
    depends_on:
      - minio
      - postgres
      - text_detector
      - image_detector
      - audio_detector
      - video_detector
      - fusion_service

  fusion_service:
    build: ./fusion_service
    container_name: fusion_service
    ports:
      - "8005:8000"
    depends_on:
      - text_detector
      - image_detector
      - audio_detector
      - video_detector

volumes:
  minio_data:
  pgdata:
